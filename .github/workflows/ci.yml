name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle runs on JDK 24, which satisfies the fluentx-gatherers toolchain
      # (Gradle treats its own running JVM as an available toolchain). The Java 17
      # modules cross-compile fine from javac 24 via their source/target settings.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (all modules)
        run: ./gradlew build -x signMavenPublication --stacktrace

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7
